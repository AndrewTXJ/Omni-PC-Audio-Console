name: checks

# The repository holds no compiled code yet, so these checks validate data and
# documentation only. Engine build, test and null-test jobs join at M1, once
# ADR-0003 settles the engine language.
#
# Deliberately language-agnostic: the tools use the Python standard library, so
# nothing here prejudges that decision.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-and-docs:
    name: Data and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11 or newer: tomllib is used from the standard library.
          python-version: "3.11"

      - name: Validate the compatibility database
        run: python3 tools/validate_compatibility.py

      - name: Check relative links in Markdown
        run: python3 tools/check_links.py

      - name: Confirm the licence file and ADR-0002 agree
        # The licence is an open decision. A LICENSE file appearing without that
        # record being updated would mean the repository states terms its own
        # decision log says are unsettled -- and the reverse, an Accepted record
        # with no licence file, is just as wrong.
        #
        # nullglob matters here: without it an unmatched pattern is passed
        # through literally, so `ls LICENSE* COPYING*` succeeds only when BOTH
        # exist -- which made an earlier version of this guard pass in exactly
        # the cases it was written to catch.
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=$(grep -m1 '^- \*\*Status:\*\* ' docs/decisions/0002-licence.md || true)
          if [ -z "${status}" ]; then
            echo "::error::Could not read the Status line from docs/decisions/0002-licence.md." >&2
            echo "Expected a line starting '- **Status:** '." >&2
            exit 1
          fi
          echo "ADR-0002 ${status}"
          licences=(LICENSE* COPYING* LICENCE*)
          echo "licence files found: ${#licences[@]} ${licences[*]-}"
          if echo "${status}" | grep -qw 'Open'; then
            if [ "${#licences[@]}" -gt 0 ]; then
              echo "::error::A licence file exists (${licences[*]}) but ADR-0002 is still marked Open." >&2
              echo "Update docs/decisions/0002-licence.md in the same change." >&2
              exit 1
            fi
          elif [ "${#licences[@]}" -eq 0 ]; then
            echo "::error::ADR-0002 is no longer Open but no licence file exists." >&2
            exit 1
          fi
